server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never fall back to index.html for hashed build assets (would MIME-sniff as JS and yield a blank page).
  location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Emulator deploy can pull multi-GB images; keep the UI proxy from 504ing early.
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_pass http://api:4000/api/;
  }
}
