apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeppole-api
  labels:
    app.kubernetes.io/name: zeppole
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zeppole
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeppole
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageOrg }}/{{ .Values.api.image }}:{{ .Values.api.tag }}"
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@zeppole-postgresql:5432/{{ .Values.postgresql.auth.database }}?schema=public"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: zeppole-secrets
                  key: jwtSecret
            - name: PORT
              value: "4000"
          command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
